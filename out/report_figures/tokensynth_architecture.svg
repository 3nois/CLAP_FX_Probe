<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 840" width="940" height="840" font-family="Noto Sans CJK KR, Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#5f6368"/>
  </marker>
</defs>
<style>
  .s{font-size:11px;fill:#5f6368}
  .m{font-size:10.5px;fill:#5f6368;font-family:ui-monospace,Menlo,Consolas,monospace}
  .h{font-size:13px;fill:#22252a;font-weight:700}
  .cap{font-size:10.5px;fill:#8a9099;letter-spacing:.06em}
  .bx{fill:#f4f6f8;stroke:#c3c9d1;stroke-width:1.3;rx:6}
  .fz{fill:#eceff2;stroke:#b9bfc7;stroke-width:1.2;stroke-dasharray:5 3;rx:6}
  .ln{stroke:#5f6368;stroke-width:1.3;fill:none;marker-end:url(#a)}
  .lnp{stroke:#9aa0a6;stroke-width:1.1;fill:none;stroke-dasharray:4 3;marker-end:url(#a)}
</style>

<rect width="940" height="840" fill="#fff"/>

<rect class="fz" x="700" y="26" width="15" height="11"/>
<text class="s" x="722" y="36">동결</text>
<rect class="bx" x="785" y="26" width="15" height="11"/>
<text class="s" x="807" y="36">학습</text>

<!-- 입력 -->
<rect class="bx" x="40" y="56" width="250" height="40"/>
<text class="h" x="56" y="81">참조 오디오 · 텍스트</text>

<rect class="bx" x="345" y="56" width="230" height="40"/>
<text class="h" x="361" y="81">MIDI</text>

<rect class="bx" x="630" y="56" width="270" height="40"/>
<text class="h" x="646" y="81">타겟 오디오 <tspan class="s" font-weight="400">(학습 시)</tspan></text>

<path class="ln" d="M165 96 V132"/>
<path class="ln" d="M460 96 V132"/>
<path class="lnp" d="M765 96 V132"/>

<!-- 인코더 -->
<rect class="fz" x="40" y="132" width="250" height="56"/>
<text class="h" x="56" y="156">CLAP</text>
<text class="s" x="56" y="176">512-d · L2 정규화</text>

<rect class="bx" x="345" y="132" width="230" height="56"/>
<text class="h" x="361" y="156">MT3 토큰화</text>
<text class="s" x="361" y="176">노트당 4토큰</text>

<rect class="fz" x="630" y="132" width="270" height="56"/>
<text class="h" x="646" y="156">DAC 인코더</text>
<text class="s" x="646" y="176">44.1 kHz · RVQ 코드북 9</text>

<path class="ln" d="M165 188 V224"/>
<path class="ln" d="M460 188 V266"/>
<path class="lnp" d="M765 188 V266"/>

<!-- projection -->
<rect class="bx" x="40" y="224" width="250" height="56"/>
<text class="h" x="56" y="248">clap_projection</text>
<text class="m" x="56" y="268">512 → 1024 → ReLU → 1024</text>

<!-- 임베딩 -->
<rect class="bx" x="345" y="266" width="555" height="52"/>
<text class="h" x="361" y="290">토큰 임베딩 <tspan class="s" font-weight="400">— 합산</tspan></text>
<text class="m" x="361" y="308">midi_tok_embed + Σᵢ₌₁⁹ audio_tok_embed[i]  →  [B, T, 1024]</text>

<path class="ln" d="M165 280 V352 H408"/>
<path class="ln" d="M622 318 V352"/>

<!-- 시퀀스 조립 -->
<rect class="bx" x="208" y="352" width="500" height="56"/>
<text class="h" x="226" y="376">시퀀스 조립</text>
<text class="m" x="226" y="396">concat( clap_proj[B,1,1024] , tok_emb[B,T,1024] ) + pos_embed</text>

<path class="ln" d="M458 408 V444"/>

<!-- transformer -->
<rect class="bx" x="208" y="444" width="500" height="72"/>
<text class="h" x="226" y="468">디코더 전용 트랜스포머 × 12</text>
<text class="m" x="226" y="488">16 head · d 1024 · FFN 4096 · dropout 0.1</text>
<text class="s" x="226" y="507">인과 마스크 · 175M 파라미터</text>

<path class="ln" d="M458 516 V552"/>

<!-- fc -->
<rect class="bx" x="208" y="552" width="500" height="52"/>
<text class="h" x="226" y="576">LayerNorm → fc</text>
<text class="m" x="226" y="594">Linear(1024, 1133 + 9×1025 = 10358)</text>

<path class="ln" d="M458 604 V640"/>

<!-- 샘플링 -->
<rect class="bx" x="208" y="640" width="500" height="56"/>
<text class="h" x="226" y="664">자기회귀 샘플링</text>
<text class="s" x="226" y="684">top-p · First-Note Guidance (γ)</text>

<path class="ln" d="M458 696 V732"/>

<!-- DAC 디코더 -->
<rect class="fz" x="208" y="732" width="500" height="52"/>
<text class="h" x="226" y="756">DAC 디코더</text>
<text class="s" x="226" y="774">delay pattern 해제 · 44.1 kHz 파형</text>
</svg>
